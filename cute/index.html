<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fireworks</title>
  <style>
    html, body {
      height: 100%;
      padding: 0;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('image_2feac3.jpg');
      /* contain giúp ảnh hiển thị toàn bộ, không bị zoom cắt viền */
      background-size: contain; 
      background-repeat: no-repeat;
      background-position: center;
      filter: grayscale(100%) brightness(0.5);
      z-index: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: transparent;
    }

    /* Màn hình chờ bắt buộc để trình duyệt cho phép phát âm thanh */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 22px;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  
  <!-- Overlay yêu cầu click để mở khóa âm thanh -->
  <div id="start-overlay">Bấm vào đây để bắt đầu (Kích hoạt âm thanh)</div>
  
  <canvas id="canvas"></canvas>

  <audio id="explosion-sound" src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Explosion_2.ogg" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth;
    let ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;

    let fireworks = [];
    let particles = [];
    let hue = 120;
    let hasStarted = false;
    
    const audioSource = document.getElementById('explosion-sound');

    // Mở khóa âm thanh và bắt đầu khi người dùng click
    document.getElementById('start-overlay').addEventListener('click', function() {
      this.style.display = 'none'; // Ẩn màn hình chờ
      
      // Mở khóa âm thanh
      let initSound = audioSource.cloneNode();
      initSound.volume = 0.01;
      initSound.play().catch(e => console.log(e));
      
      hasStarted = true;
      shootFirework(); // Bắn quả đầu tiên ngay lập tức
    });

    function playExplosion() {
      let sound = audioSource.cloneNode();
      sound.volume = 0.5;
      sound.play().catch(e => console.log(e));
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function shootFirework() {
      // Bắn 1 quả từ giữa màn hình dưới lên
      fireworks.push(new Firework(cw / 2, ch, cw / 2, random(ch * 0.1, ch * 0.3)));
    }

    class Firework {
      constructor(sx, sy, tx, ty) {
        this.x = sx;
        this.y = sy;
        this.sx = sx;
        this.sy = sy;
        this.tx = tx;
        this.ty = ty;
        this.distanceToTarget = Math.hypot(tx - sx, ty - sy);
        this.distanceTraveled = 0;
        this.coordinates = [];
        this.coordinateCount = 3;
        while (this.coordinateCount--) {
          this.coordinates.push([this.x, this.y]);
        }
        this.angle = Math.atan2(ty - sy, tx - sx);
        this.speed = 2;
        this.acceleration = 1.05;
        this.brightness = random(50, 70);
      }
      update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.acceleration;
        let vx = Math.cos(this.angle) * this.speed;
        let vy = Math.sin(this.angle) * this.speed;
        this.distanceTraveled = Math.hypot(this.x + vx - this.sx, this.y + vy - this.sy);
        
        if (this.distanceTraveled >= this.distanceToTarget) {
          createParticles(this.tx, this.ty);
          playExplosion();
          fireworks.splice(index, 1);
        } else {
          this.x += vx;
          this.y += vy;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = `hsl(${hue}, 100%, ${this.brightness}%)`;
        ctx.stroke();
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.coordinates = [];
        this.coordinateCount = 5;
        while (this.coordinateCount--) {
          this.coordinates.push([this.x, this.y]);
        }
        this.angle = random(0, Math.PI * 2);
        this.speed = random(2, 18); // Tăng tốc độ văng để nổ to hơn
        this.friction = 0.93;
        this.gravity = 0.8;
        this.hue = random(hue - 50, hue + 50);
        this.brightness = random(50, 80);
        this.alpha = 1;
        this.decay = random(0.01, 0.02); // Sáng lâu hơn một chút
      }
      update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= this.decay;
        if (this.alpha <= this.decay) {
          particles.splice(index, 1);
        }
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
        ctx.stroke();
      }
    }

    function createParticles(x, y) {
      let particleCount = 500; // Tăng số lượng hạt lên 500 để nổ thật rực rỡ
      while (particleCount--) {
        particles.push(new Particle(x, y));
      }
    }

    function loop() {
      requestAnimationFrame(loop);
      hue += 0.5;
      
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; // Giảm mờ để đuôi pháo hoa dài hơn
      ctx.fillRect(0, 0, cw, ch);
      ctx.globalCompositeOperation = 'lighter';

      let i = fireworks.length;
      while (i--) {
        fireworks[i].draw();
        fireworks[i].update(i);
      }

      let j = particles.length;
      while (j--) {
        particles[j].draw();
        particles[j].update(j);
      }

      // Chỉ bắn 1 quả tiếp theo khi màn hình gần như đã sạch pháo hoa
      if (hasStarted && fireworks.length === 0 && particles.length <= 10) {
        if (Math.random() < 0.05) {
          shootFirework();
        }
      }
    }

    window.addEventListener('resize', () => {
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = cw;
      canvas.height = ch;
    });

    loop();
  </script>
</body>
</html>
