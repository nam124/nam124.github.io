<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nam & Trang Fireworks</title>
  <style>
    html, body {
      height: 100%;
      padding: 0;
      margin: 0;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }
    
    /* Lớp background chứa ảnh đen trắng */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('image_2feac3.jpg');
      background-size: cover;
      background-position: center;
      /* Chuyển thành đen trắng và giảm sáng để pháo hoa nổi bật */
      filter: grayscale(100%) brightness(0.4);
      z-index: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .text-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 0, 128, 0.9);
      font-size: 50px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      z-index: 2;
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 0, 128, 0.8), 0 0 30px rgba(255, 0, 128, 0.6);
      pointer-events: none;
    }

    #start-msg {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.8);
      font-family: Arial, sans-serif;
      z-index: 3;
      font-size: 16px;
      pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <!-- Thêm khối background vào dưới cùng -->
  <div class="bg-image"></div>
  
  <div class="text-container">
    NAM ❤ TRANG
  </div>
  <div id="start-msg">Click vào màn hình để bật âm thanh</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth;
    let ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;

    let fireworks = [];
    let particles = [];
    let hue = 120;
    
    // Khởi tạo âm thanh pháo hoa
    let audioEnabled = false;
    const explosionSound = new Audio('https://upload.wikimedia.org/wikipedia/commons/a/a2/Explosion_2.ogg');
    
    window.addEventListener('click', () => {
      if (!audioEnabled) {
        audioEnabled = true;
        document.getElementById('start-msg').style.opacity = '0';
        // Phát thử 1 âm thanh rất nhỏ để trình duyệt cho phép phát audio
        let initSound = explosionSound.cloneNode();
        initSound.volume = 0.01;
        initSound.play().catch(e => console.log("Audio play failed:", e));
      }
    });

    function playExplosion() {
      if (!audioEnabled) return;
      let sound = explosionSound.cloneNode();
      sound.volume = 0.3; // Chỉnh âm lượng từ 0.0 đến 1.0
      sound.play().catch(e => console.log(e));
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    class Firework {
      constructor(sx, sy, tx, ty) {
        this.x = sx;
        this.y = sy;
        this.sx = sx;
        this.sy = sy;
        this.tx = tx;
        this.ty = ty;
        this.distanceToTarget = Math.hypot(tx - sx, ty - sy);
        this.distanceTraveled = 0;
        this.coordinates = [];
        this.coordinateCount = 3;
        while (this.coordinateCount--) {
          this.coordinates.push([this.x, this.y]);
        }
        this.angle = Math.atan2(ty - sy, tx - sx);
        this.speed = 2;
        this.acceleration = 1.05;
        this.brightness = random(50, 70);
      }
      update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.acceleration;
        let vx = Math.cos(this.angle) * this.speed;
        let vy = Math.sin(this.angle) * this.speed;
        this.distanceTraveled = Math.hypot(this.x + vx - this.sx, this.y + vy - this.sy);
        
        if (this.distanceTraveled >= this.distanceToTarget) {
          createParticles(this.tx, this.ty);
          playExplosion(); // Gọi hàm phát âm thanh khi nổ
          fireworks.splice(index, 1);
        } else {
          this.x += vx;
          this.y += vy;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = `hsl(${hue}, 100%, ${this.brightness}%)`;
        ctx.stroke();
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.coordinates = [];
        this.coordinateCount = 5;
        while (this.coordinateCount--) {
          this.coordinates.push([this.x, this.y]);
        }
        this.angle = random(0, Math.PI * 2);
        this.speed = random(1, 10);
        this.friction = 0.95;
        this.gravity = 1;
        this.hue = random(hue - 50, hue + 50);
        this.brightness = random(50, 80);
        this.alpha = 1;
        this.decay = random(0.015, 0.03);
      }
      update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= this.decay;
        if (this.alpha <= this.decay) {
          particles.splice(index, 1);
        }
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
        ctx.stroke();
      }
    }

    function createParticles(x, y) {
      let particleCount = 100;
      while (particleCount--) {
        particles.push(new Particle(x, y));
      }
    }

    function loop() {
      requestAnimationFrame(loop);
      hue += 0.5;
      
      // Hiệu ứng lưu ảnh nền trong suốt để tạo đuôi pháo hoa
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(0, 0, cw, ch);
      ctx.globalCompositeOperation = 'lighter';

      let i = fireworks.length;
      while (i--) {
        fireworks[i].draw();
        fireworks[i].update(i);
      }

      let j = particles.length;
      while (j--) {
        particles[j].draw();
        particles[j].update(j);
      }

      // Tốc độ bắn pháo hoa ngẫu nhiên
      if (Math.random() < 0.05) {
        fireworks.push(new Firework(cw / 2, ch, random(0, cw), random(0, ch / 2)));
      }
    }

    window.addEventListener('resize', () => {
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = cw;
      canvas.height = ch;
    });

    loop();
  </script>
</body>
</html>
